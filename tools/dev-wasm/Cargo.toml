[package]
name = "yew-lynx-dev-server"
description = "WASM build watcher and reload server for Lynx Element Bridge examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.4", features = ["ws"] }
libc = "0.2.172"
notify = "8.0.0"
serde.workspace = true
serde_json = "1.0.140"
sha2 = "0.10.8"
tokio = { version = "1.44.1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
