[package]
name = "yew-lynx-counter"
description = "Focused recording fixture for Yew native render, tap, and cleanup checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.yew-lynx]
fixture = "host-independent-recording-backend"
verified-behavior = ["initial-render", "tap-update", "listener-cleanup", "flush"]

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
replacement-fixture = []

[dependencies]
lynx-element-bridge-core.workspace = true
lynx-element-bridge-yew.workspace = true
yew.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lynx-element-bridge-ffi.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
lynx-element-bridge-wasm-guest.workspace = true

[dev-dependencies]
lynx-element-bridge-wasm-guest.workspace = true
