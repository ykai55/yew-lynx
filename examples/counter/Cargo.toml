[package]
name = "yew-lynx-counter"
description = "Yew counter application for Lynx Native and WASM rendering"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
lynx = { workspace = true, features = ["yew"] }
lynx-element-bridge-core.workspace = true
yew.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lynx-element-bridge-ffi.workspace = true

[dev-dependencies]
lynx-element-bridge-wasm-guest.workspace = true
lynx-yew-runtime.workspace = true
