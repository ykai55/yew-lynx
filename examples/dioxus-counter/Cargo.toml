[package]
name = "lynx-element-bridge-dioxus-counter"
description = "RSX-authored dioxus-core VirtualDom counter for Lynx Element Bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
dioxus-core.workspace = true
lynx = { workspace = true, features = ["dioxus"] }
lynx-element-bridge-core.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lynx-element-bridge-ffi.workspace = true

[dev-dependencies]
lynx-element-bridge-wasm-guest.workspace = true
lynx-dioxus-runtime.workspace = true
