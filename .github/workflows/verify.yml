name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Generic renderer verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          submodules: true

      - name: Install pinned Node toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: adapters/mts/package-lock.json

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal \
            --component clippy,rustfmt --target aarch64-linux-android
          rustup default 1.85.0
          rustc --version

      - name: Run repository verification
        run: ./scripts/verify.sh
