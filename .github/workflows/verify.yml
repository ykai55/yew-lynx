name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Generic renderer verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          submodules: true

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal \
            --component clippy,rustfmt \
            --target aarch64-linux-android,wasm32-wasip1
          rustup default 1.85.0
          rustc --version

      - name: Install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.2.9519653"

      - name: Verify checked-in FlatBuffers bindings
        env:
          FLATC_SHA256: 6f01258d7475806f375d6da66a61df47add8016edd73f1774673f37b80b9a711
          FLATC_URL: https://github.com/google/flatbuffers/releases/download/v25.2.10/Linux.flatc.binary.g%2B%2B-13.zip
        run: |
          archive="$RUNNER_TEMP/flatc-25.2.10.zip"
          directory="$RUNNER_TEMP/flatc-25.2.10"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "$FLATC_URL" --output "$archive"
          printf '%s  %s\n' "$FLATC_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$directory"
          unzip -q "$archive" -d "$directory"
          chmod +x "$directory/flatc"
          PATH="$directory:$PATH" ./crates/element-bridge-protocol/regenerate.sh
          git diff --exit-code -- \
            crates/element-bridge-protocol/src/guest_protocol_generated.rs

      - name: Run repository verification
        run: ./scripts/verify.sh
