name: Android integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build pinned native renderer APK (${{ matrix.backend }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        backend: [yew, dioxus]

    steps:
      - name: Check out repository and Lynx submodule
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          submodules: recursive

      - name: Install JDK 11
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: 11

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Install Rust
        run: |
          rustup toolchain install 1.85.0 --profile minimal \
            --target aarch64-linux-android
          rustup default 1.85.0

      - name: Install Android toolchains
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.1" \
            "ndk;21.1.6352462" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      - name: Install Lynx Python dependencies
        run: python3 -m pip install -r third_party/lynx/tools/vpython_tools/requirements.txt

      - name: Build standalone APK
        run: ./scripts/build-android.sh --backend "${{ matrix.backend }}" --clean

      - name: Upload APK and build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lynx-element-bridge-android-${{ matrix.backend }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            .deps/android/apks/lynx-element-bridge-${{ matrix.backend }}.apk
            .deps/android/build-evidence-${{ matrix.backend }}.txt
