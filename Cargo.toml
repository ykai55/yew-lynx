[workspace]
members = ["crates/native-renderer-adapter", "examples/counter"]
exclude = [".deps/yew"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/ykai55/yew-lynx"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
yew = { path = ".deps/yew/packages/yew", features = ["native_renderer"] }
yew-lynx-adapter = { path = "crates/native-renderer-adapter" }
