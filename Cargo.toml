[workspace]
members = [
  "crates/element-bridge-core",
  "crates/element-bridge-wire",
  "crates/element-bridge-ffi",
  "adapters/yew",
  "adapters/dioxus",
  "crates/adapter-conformance",
  "examples/counter",
  "examples/dioxus-counter",
]
exclude = [".deps/yew"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/ykai55/yew-lynx"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
flatbuffers = "=25.2.10"
dioxus-core = "=0.7.10"
lynx-element-bridge-core = { path = "crates/element-bridge-core" }
lynx-element-bridge-wire = { path = "crates/element-bridge-wire" }
lynx-element-bridge-ffi = { path = "crates/element-bridge-ffi" }
yew = { path = ".deps/yew/packages/yew", features = ["native_renderer"] }
lynx-element-bridge-yew = { path = "adapters/yew" }
