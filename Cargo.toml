[workspace]
members = [
  "crates/element-bridge-core",
  "crates/element-bridge-ffi",
  "crates/element-bridge-protocol",
  "crates/element-bridge-wasm-guest",
  "crates/element-bridge-wamr-host",
  "adapters/yew",
  "adapters/dioxus",
  "crates/adapter-conformance",
  "tools/dev-wasm",
  "examples/counter",
  "examples/dioxus-counter",
]
exclude = [".deps/yew"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/ykai55/yew-lynx"
publish = false

[workspace.dependencies]
dioxus-core = "=0.7.10"
dioxus-core-macro = "=0.7.10"
dioxus-signals = "=0.7.10"
lynx-element-bridge-core = { path = "crates/element-bridge-core" }
lynx-element-bridge-ffi = { path = "crates/element-bridge-ffi" }
lynx-element-bridge-protocol = { path = "crates/element-bridge-protocol" }
lynx-element-bridge-wasm-guest = { path = "crates/element-bridge-wasm-guest" }
lynx-element-bridge-wamr-host = { path = "crates/element-bridge-wamr-host" }
serde = { version = "1.0.219", features = ["derive"] }
yew = { path = ".deps/yew/packages/yew", features = ["native_renderer"] }
lynx-element-bridge-yew = { path = "adapters/yew" }
